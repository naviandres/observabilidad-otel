apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lab-collector
  labels:
    {{- include "otel-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        {{- include "otel-lab.labels" . | nindent 8 }}
        app.kubernetes.io/component: otel-collector
      annotations:
        # Hash de la config -> rollout automatico al cambiar el YAML (inmutable
        # y versionada junto al binario, PLAN §2.B-GCP).
        checksum/config: {{ sha256sum (.Files.Get "files/otel-collector-gcp.yaml") }}
        # Workload Identity: la anotacion iam.gke.io/gcp-service-account NO va aqui.
        # GKE WI lee la anotacion del ServiceAccount (templates/serviceaccount.yaml),
        # no del pod template. El binding workloadIdentityUser (SA GCP <- KSA) se hace
        # fuera del chart (Makefile gcp-start).
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- include "otel-lab.spotPlacement" . | nindent 6 }}
      # Tolerancia a desalojo spot (R-22): gracia baja + preStop para drenar batches.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: otel-collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["/otelcol-contrib"]
          args:
            - --config=/etc/otel/otel-collector-gcp.yaml
          env:
            - name: GCP_PROJECT_ID
              value: {{ .Values.global.project | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: {{ .Values.collector.env.OTEL_TRACES_EXPORTER | quote }}
            - name: GOMEMLIMIT
              value: {{ .Values.collector.goMemLimit | quote }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: prometheus
              containerPort: 8889
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
            # filelog: stdout de los pods del nodo -> pipeline de logs.
            # Cluster single-node: el collector ve los logs de service-a/b.
            # readOnly: el receiver solo lee; los offsets no se persisten
            # (start_at: end hace el checkpoint irrelevante).
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-lab-collector-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lab-collector
  labels:
    {{- include "otel-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  # ClusterIP SIEMPRE: sin LoadBalancer publico (lista negra GCP, PLAN §3.2);
  # el acceso es kubectl port-forward autenticado (§2.B-GCP).
  type: ClusterIP
  selector:
    app.kubernetes.io/component: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: prometheus
      port: 8889
      targetPort: prometheus
