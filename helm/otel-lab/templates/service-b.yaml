apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  labels:
    {{- include "otel-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: service-b
  template:
    metadata:
      labels:
        {{- include "otel-lab.labels" . | nindent 8 }}
        app.kubernetes.io/component: service-b
    spec:
      {{- include "otel-lab.spotPlacement" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: service-b
          image: "{{ .Values.serviceB.image.repository }}:{{ .Values.serviceB.image.tag }}"
          imagePullPolicy: IfNotPresent
          # Base de datos `inventory` (creada por el init-script 01-init.sh);
          # password desde el secreto CSI, nunca del values.yaml.
          command: ["/bin/sh", "-c"]
          args:
            - |
              export DATABASE_URL="postgresql://{{ .Values.postgres.user }}:$(cat {{ .Values.secrets.pgPassword.mountPath }}/{{ .Values.secrets.pgPassword.fileName }})@postgres:5432/inventory"
              exec uvicorn app.main:app --host 0.0.0.0 --port {{ .Values.serviceB.containerPort }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-lab-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "service-b"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=service-b"
            # Ronda 6 (A12): Cloud Monitoring/GMP solo acepta escrituras de un
            # metric-type cada 60 s; el reader OTel del service exporta a ese
            # ritmo (telemetry.py respeta esta variable; AWS no la fija y sigue
            # a 5 s para EMF).
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ .Values.metrics.exportIntervalMillis | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.serviceB.containerPort }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.serviceB.resources | nindent 12 }}
          volumeMounts:
            {{- include "otel-lab.pgSecretMount" . | nindent 12 }}
      volumes:
        {{- include "otel-lab.pgSecretVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  labels:
    {{- include "otel-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-b
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: service-b
  ports:
    - name: http
      port: {{ .Values.serviceB.servicePort }}
      targetPort: http
{{- if .Values.expose.serviceBLoadBalancer }}
---
# Excepcion de sesion unica para el flujo cruzado de nubes (ver values.expose):
# LB REGIONAL (misma region que el cluster) etiquetado con el entorno del lab.
# Se apaga con --set expose.serviceBLoadBalancer=false y muere con el cluster.
apiVersion: v1
kind: Service
metadata:
  name: service-b-lb
  labels:
    {{- include "otel-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-b
    env: {{ .Values.global.environment }}
  annotations:
    networking.gke.io/load-balancer-type: "Regional"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: service-b
  ports:
    - name: http
      port: {{ .Values.serviceB.servicePort }}
      targetPort: http
{{- end }}
