apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-ui-on-gcp
  labels:
    {{- include "otel-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: jaeger
  template:
    metadata:
      labels:
        {{- include "otel-lab.labels" . | nindent 8 }}
        app.kubernetes.io/component: jaeger
    spec:
      {{- include "otel-lab.spotPlacement" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: jaeger
          image: "{{ .Values.jaeger.image.repository }}:{{ .Values.jaeger.image.tag }}"
          imagePullPolicy: IfNotPresent
          # OTLP receiver (gRPC :4317 / HTTP :4318) del all-in-one; el Collector
          # le manda el fan-out de trazas por otlphttp/jaeger-gcp (§2.A-GCP/§3.C).
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: ui
              containerPort: {{ .Values.jaeger.containerPort }}
            - name: otlp-http
              containerPort: {{ .Values.jaeger.otlpHttpPort }}
          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.jaeger.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui-on-gcp
  labels:
    {{- include "otel-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: jaeger
spec:
  # ClusterIP SIEMPRE: sin ingress publico (lista negra GCP, PLAN §3.2); la UI
  # y el OTLP se acceden por kubectl port-forward autenticado (§2.B-GCP).
  type: ClusterIP
  selector:
    app.kubernetes.io/component: jaeger
  ports:
    - name: ui
      port: {{ .Values.jaeger.servicePort }}
      targetPort: ui
    - name: otlp-http
      port: {{ .Values.jaeger.otlpHttpPort }}
      targetPort: otlp-http
