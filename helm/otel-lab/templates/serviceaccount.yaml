apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "otel-lab.labels" . | nindent 4 }}
  annotations:
    # Workload Identity (mitad K8s): GKE solo honra esta anotacion cuando vive
    # en el KSA (no en el pod template). Fix 21b: antes estaba en collector.yaml
    # y el collector caia al SA del nodo -> PermissionDenied monitoring.timeSeries.create.
    iam.gke.io/gcp-service-account: {{ .Values.collector.gcpServiceAccount }}
# Workload Identity (mitad GCP, fuera del chart): este SA de K8s se enlaza (fuera del chart, #21b) al SA de
# GCP {{ .Values.collector.gcpServiceAccount }} con
#   gcloud iam service-accounts add-iam-policy-binding \
#     --member "serviceAccount:{{ .Values.global.project }}.svc.id.goog[{{ .Release.Namespace }}/{{ .Values.serviceAccount.name }}]" \
#     --role roles/iam.workloadIdentityUser {{ .Values.collector.gcpServiceAccount }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.pgPassword.providerClass }}
  labels:
    {{- include "otel-lab.labels" . | nindent 4 }}
spec:
  # Solo el NOMBRE del secreto; el valor nunca aparece en values ni en Git
  # (docs/conventions.md, PLAN §2.B-GCP).
  # provider: nombre segun la instalacion del driver (values.secrets.pgPassword.providerName;
  # add-on GKE = gke, comunitario = gcp-secret-manager).
  provider: {{ .Values.secrets.pgPassword.providerName }}
  parameters:
    # add-on GKE usa la clave resourceName (docs/secret-manager-managed-csi-component);
    # el provider comunitario usa name.
    secrets: |
      - resourceName: "projects/{{ .Values.global.project }}/secrets/{{ .Values.secrets.pgPassword.secretName }}/versions/latest"
        path: "{{ .Values.secrets.pgPassword.fileName }}"
