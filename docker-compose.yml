# Full local development stack (all-in-one) — the harness smoke-tests this file.
#
#   docker compose up --build -d          # from src/observabilidad-otel
#
# The split layout from PLAN §1.A is deploy/docker-compose.yml (core) +
# deploy/docker-compose.observability.yml (jaeger/prometheus/grafana). This file
# keeps the two stacks combined so `docker compose up` at the repo root still
# brings up everything.
#
# Image tags are pinned on purpose: never `:latest` (docs/conventions.md, C3).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      # Fresh volume => schema + inventory seed run automatically (no manual step).
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      # Local/develop config (PLAN §7); validated with the contrib binary.
      - ./deploy/collector/otel-collector-local.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Collector self-telemetry
      - "8889:8889"   # Prometheus exporter (application metrics)
    depends_on:
      - jaeger
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686" # Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./deploy/collector/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # Provisioned by code, never configured by hand (PLAN §3.A).
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro

  service-a:
    build: ./service-a
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/orders
      - INVENTORY_SERVICE_URL=http://service-b:8001
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=service-a
      - OTEL_RESOURCE_ATTRIBUTES=service.name=service-a
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  service-b:
    build: ./service-b
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/inventory
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=service-b
      - OTEL_RESOURCE_ATTRIBUTES=service.name=service-b
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  postgres_data:
