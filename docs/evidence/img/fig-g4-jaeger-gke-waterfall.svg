       Este proyecto no genera capturas automaticas. Sustituir por la captura
       PNG/JPEG manteniendo el nombre base del archivo. -->
  <rect x="4" y="4" width="1272" height="712" fill="#fafafa" stroke="gray" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="640" y="130" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="crimson">PLACEHOLDER-HUMAN-REQUIRED</text>
  <text x="640" y="200" text-anchor="middle" font-family="sans-serif" font-size="26" fill="black">Figura G4 (GCP) — Jaeger UI desplegada en GKE — waterfall cross-service</text>
  <text x="90" y="330" font-family="sans-serif" font-size="17" fill="dimgray">Fan-out del collector GCP a jaeger-ui-on-gcp: traza con service-a POST /orders -></text>
  <text x="90" y="356" font-family="sans-serif" font-size="17" fill="dimgray">service-b -> SELECT/UPDATE inventory (23 spans, ~250 ms raiz).</text>
