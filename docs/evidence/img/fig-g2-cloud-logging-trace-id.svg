<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Cloud Logging (GCP) — log con jsonPayload.trace_id">
  <!-- PLACEHOLDER-HUMAN-REQUIRED: fichero RESERVADO para la captura real.
       Este proyecto no genera capturas automaticas. Sustituir por la captura
       PNG/JPEG manteniendo el nombre base del archivo. -->
  <rect x="4" y="4" width="1272" height="712" fill="#fafafa" stroke="gray" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="640" y="130" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="crimson">PLACEHOLDER-HUMAN-REQUIRED</text>
  <text x="640" y="200" text-anchor="middle" font-family="sans-serif" font-size="26" fill="black">Figura G2 (GCP) — Cloud Logging (GCP) — log con jsonPayload.trace_id</text>
  <text x="90" y="330" font-family="sans-serif" font-size="17" fill="dimgray">Entradas de service-a/service-b con el campo trace_id normalizado en el payload JSON</text>
  <text x="90" y="356" font-family="sans-serif" font-size="17" fill="dimgray">(asercion A11).</text>
  <text x="90" y="422" font-family="sans-serif" font-size="14" fill="gray">Consola Logs Explorer; query: jsonPayload.trace_id="&lt;id-de-la-corrida>" AND</text>
  <text x="90" y="444" font-family="sans-serif" font-size="14" fill="gray">resource.type=gke_container.</text>
  <text x="640" y="672" text-anchor="middle" font-family="monospace" font-size="13" fill="gray">reemplazo esperado: fig-g2-cloud-logging-trace-id.png (mismo nombre base)</text>
