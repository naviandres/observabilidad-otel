<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="AWS X-Ray — service map">
  <!-- PLACEHOLDER-HUMAN-REQUIRED: fichero RESERVADO para la captura real.
       Este proyecto no genera capturas automaticas. Sustituir por la captura
       PNG/JPEG manteniendo el nombre base del archivo. -->
  <rect x="4" y="4" width="1272" height="712" fill="#fafafa" stroke="gray" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="640" y="130" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="crimson">PLACEHOLDER-HUMAN-REQUIRED</text>
  <text x="640" y="200" text-anchor="middle" font-family="sans-serif" font-size="26" fill="black">Figura A1 (AWS) — AWS X-Ray — service map</text>
  <text x="90" y="330" font-family="sans-serif" font-size="17" fill="dimgray">Grafo de servicio service-a -> service-b -> (SQL postgres) con tiempos agregados de la</text>
  <text x="90" y="356" font-family="sans-serif" font-size="17" fill="dimgray">sesion Fargate; prueba visual de la propagacion W3C entre contenedores.</text>
  <text x="90" y="422" font-family="sans-serif" font-size="14" fill="gray">Sesion AWS viva (make aws-start + aws-access-grant); POST /orders x N; consola X-Ray (us-east-1)</text>
  <text x="90" y="444" font-family="sans-serif" font-size="14" fill="gray">-> Service map.</text>
  <text x="640" y="672" text-anchor="middle" font-family="monospace" font-size="13" fill="gray">reemplazo esperado: fig-a1-xray-service-map.png (mismo nombre base)</text>
</svg>
