<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Jaeger UI (local) — waterfall de service-a -> service-b -> DB">
  <!-- PLACEHOLDER-HUMAN-REQUIRED: fichero RESERVADO para la captura real.
       Este proyecto no genera capturas automaticas. Sustituir por la captura
       PNG/JPEG manteniendo el nombre base del archivo. -->
  <rect x="4" y="4" width="1272" height="712" fill="#fafafa" stroke="gray" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="640" y="130" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="crimson">PLACEHOLDER-HUMAN-REQUIRED</text>
  <text x="640" y="200" text-anchor="middle" font-family="sans-serif" font-size="26" fill="black">Figura L1 (local) — Jaeger UI (local) — waterfall de service-a -> service-b -> DB</text>
  <text x="90" y="330" font-family="sans-serif" font-size="17" fill="dimgray">Traza completa de POST /orders con spans de negocio (order.process, inventory.reserve,</text>
  <text x="90" y="356" font-family="sans-serif" font-size="17" fill="dimgray">payment.gateway_call) y spans SQL, todos bajo el mismo trace_id W3C.</text>
  <text x="90" y="422" font-family="sans-serif" font-size="14" fill="gray">docker compose up (modo local); POST /orders; http://localhost:16686 -> Search -> abrir la traza</text>
  <text x="90" y="444" font-family="sans-serif" font-size="14" fill="gray">mas reciente con todos los spans.</text>
  <text x="640" y="672" text-anchor="middle" font-family="monospace" font-size="13" fill="gray">reemplazo esperado: fig-l1-jaeger-local-waterfall.png (mismo nombre base)</text>
</svg>
