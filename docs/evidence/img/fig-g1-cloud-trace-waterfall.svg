<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Cloud Trace (GCP) — waterfall con spans de ambos servicios">
  <!-- PLACEHOLDER-HUMAN-REQUIRED: fichero RESERVADO para la captura real.
       Este proyecto no genera capturas automaticas. Sustituir por la captura
       PNG/JPEG manteniendo el nombre base del archivo. -->
  <rect x="4" y="4" width="1272" height="712" fill="#fafafa" stroke="gray" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="640" y="130" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="crimson">PLACEHOLDER-HUMAN-REQUIRED</text>
  <text x="640" y="200" text-anchor="middle" font-family="sans-serif" font-size="26" fill="black">Figura G1 (GCP) — Cloud Trace (GCP) — waterfall con spans de ambos servicios</text>
  <text x="90" y="330" font-family="sans-serif" font-size="17" fill="dimgray">Traza W3C con ID preservado (sin traduccion al formato X-Ray) y spans de</text>
  <text x="90" y="356" font-family="sans-serif" font-size="17" fill="dimgray">service-a/service-b incluyendo INSERT/SELECT (asercion A10).</text>
  <text x="90" y="422" font-family="sans-serif" font-size="14" fill="gray">Sesion GCP viva; POST /orders via port-forward; consola Cloud Trace -> buscar el trace_id que</text>
  <text x="90" y="444" font-family="sans-serif" font-size="14" fill="gray">sale en el log.</text>
  <text x="640" y="672" text-anchor="middle" font-family="monospace" font-size="13" fill="gray">reemplazo esperado: fig-g1-cloud-trace-waterfall.png (mismo nombre base)</text>
</svg>
