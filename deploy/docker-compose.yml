# Core application stack (PLAN §1.A): postgres + OTel Collector + both services.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Pair it with deploy/docker-compose.observability.yml (Jaeger + Prometheus +
# Grafana). Both files live in deploy/, so they share the same Compose project
# and default network and can reach each other by service name.
#
# Image tags are pinned on purpose: never `:latest` (docs/conventions.md, C3).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      # Fresh volume => schema + inventory seed run automatically (no manual step).
      - ../init-scripts:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Collector self-telemetry
      - "8889:8889"   # Prometheus exporter (application metrics)

  service-a:
    build: ../service-a
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/orders
      - INVENTORY_SERVICE_URL=http://service-b:8001
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=service-a
      - OTEL_RESOURCE_ATTRIBUTES=service.name=service-a
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  service-b:
    build: ../service-b
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/inventory
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=service-b
      - OTEL_RESOURCE_ATTRIBUTES=service.name=service-b
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  postgres_data:
