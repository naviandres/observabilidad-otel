receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 15s
          static_configs:
            - targets: ['127.0.0.1:8888']

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  resourcedetection:
    detectors: [env, system]
    timeout: 2s
    override: false

  resource:
    attributes:
      - key: deployment.environment
        value: "lab"
        action: upsert

  attributes/redact:
    actions:
      - key: credit_card
        action: delete

  filter/cloudwatch-metrics:
    metrics:
      include:
        match_type: strict
        metric_names:
          - orders_created_total
          - orders_failed_total
          - payment_authorization_failures_total
          - db_query_errors_total

  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 5s

exporters:
  awsxray:
    region: us-east-1

  awscloudwatchlogs:
    log_group_name: "/otel/labs/ecs-cluster"
    log_stream_name: "tasks"
    region: us-east-1

  awsemf:
    region: us-east-1
    namespace: OtelLab

  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "otel"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [awsxray]
    metrics/emf:
      receivers: [otlp]
      processors: [memory_limiter, filter/cloudwatch-metrics, batch]
      exporters: [awsemf]
    metrics/prometheus:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [awscloudwatchlogs]
  telemetry:
    metrics:
      address: "127.0.0.1:8888"